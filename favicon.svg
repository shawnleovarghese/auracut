<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 135 Degree Brand Gradient: 0% #0757C9, 50% #1683FF, 100% #00AEEF -->
    <linearGradient id="auracutGradient135" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0757C9" />
      <stop offset="50%" stop-color="#1683FF" />
      <stop offset="100%" stop-color="#00AEEF" />
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base #0B0F14 -->
  <rect width="512" height="512" rx="115" fill="#0B0F14" />
  
  <!-- Subtle Outer Border Accent -->
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Brand Glyph Group with 135 deg Gradient -->
  <g transform="translate(106, 106) scale(0.5859375)" fill="url(#auracutGradient135)">
    <!-- AuraCut Stylized Film & Diamond Crest -->
    <path d="M256 32 C132.3 32 32 132.3 32 256 C32 379.7 132.3 480 256 480 C379.7 480 480 379.7 480 256 C480 132.3 379.7 32 256 32 Z M208 160 L352 256 L208 352 Z" fill-rule="evenodd" />
  </g>
</svg>